[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triangle_rasterizer"
version = "1.3.0"
description = "Data-race-free 2D triangle rasterizer (OpenMP CPU / CUDA GPU) with a stable C ABI and a Python (ctypes) wrapper."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Triangle Rasterizer Contributors" },
]
keywords = [
    "rasterizer", "triangle", "opengl", "vulkan", "opengl-style",
    "openmp", "cuda", "gpu", "rasterisation", "2d-graphics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
]
# The native shared library (triangle_rasterizer.dll / .so / .dylib) is built
# separately with CMake (see README and scripts/build_*.ps1|.sh); this project
# only packages the Python (ctypes) wrapper around it.
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
# PIL is used by examples/ to save PNG previews; the package itself does not
# require it (examples fall back to a pure-Python PPM writer).
img = ["pillow>=9.0"]
dev = ["pytest>=7.0", "pillow>=9.0"]

# [project.urls]  # set these to point at your real GitHub repository
# Homepage = "https://github.com/<org>/triangle-rasterizer"
# Source =   "https://github.com/<org>/triangle-rasterizer"

[tool.setuptools]
# Only the pure-Python wrapper package is shipped via pip.  The compiled
# shared library is produced by CMake and either discovered next to the
# package at runtime (see triangle_rasterizer/_loader.py) or installed
# alongside it after a CMake build.
packages = ["triangle_rasterizer"]
